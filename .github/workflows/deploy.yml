name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - main  # Сценарий будет срабатывать при пуше в ветку main
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой на сайте GitHub

env:
  REGISTRY: ghcr.io
  # Автоматически подставит имя вашего репозитория в нижнем регистре
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Включаем современный сборщик для ускорения процессов
          buildx: true

      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Пароль генерируется автоматически самим GitHub на время сборки
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      # Настройка кэширования слоев Docker (чтобы тяжелый torch не качался заново при каждой сборке на серверах GitHub)
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
