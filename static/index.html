<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моя Говорилка Silero TTS</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e2e; color: #cdd6f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .container { background-color: #252538; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); width: 100%; max-width: 600px; }
    h1 { margin-top: 0; color: #89b4fa; text-align: center; font-size: 24px; }
    textarea { width: 100%; height: 200px; background-color: #181825; border: 1px solid #45475a; border-radius: 8px; color: #cdd6f4; padding: 12px; font-size: 16px; resize: none; box-sizing: border-box; margin-bottom: 20px; }
    textarea:focus { border-color: #89b4fa; outline: none; }
    .controls { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; }
    select { flex: 1; background-color: #181825; border: 1px solid #45475a; border-radius: 8px; color: #cdd6f4; padding: 10px; font-size: 16px; cursor: pointer; }
    button { background-color: #89b4fa; color: #11111b; border: none; border-radius: 8px; padding: 10px 24px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
    button:hover { background-color: #b4befe; }
    button:disabled { background-color: #45475a; color: #7f849c; cursor: not-allowed; }
    audio { width: 100%; margin-top: 10px; border-radius: 8px; }
    .status { text-align: center; color: #a6e3a1; font-size: 14px; min-height: 20px; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="container">
  <h1>Нейросетевая читалка</h1>
  <textarea id="textInput" placeholder="Вставьте ваш текст сюда..."></textarea>

  <div class="controls">
    <select id="speakerSelect">
      <option value="kseniya">Ксения (Женский)</option>
      <option value="baya">Бая (Мягкий женский)</option>
      <option value="xenia">Ксения 2 (Женский)</option>
      <option value="aidar">Айдар (Мужской)</option>
      <option value="eugene">Евгений (Строгий мужской)</option>
    </select>
    <button id="speakBtn" onclick="generateSpeech()">Озвучить</button>
  </div>

  <div class="status" id="statusText"></div>
  <audio id="audioPlayer" controls style="display: none;"></audio>
</div>

<script>
  async function generateSpeech() {
    const text = document.getElementById('textInput').value.trim();
    const speaker = document.getElementById('speakerSelect').value;
    const btn = document.getElementById('speakBtn');
    const status = document.getElementById('statusText');
    const player = document.getElementById('audioPlayer');

    if (!text) {
      status.style.color = '#f38ba8';
      status.innerText = 'Пожалуйста, введите текст.';
      return;
    }

    btn.disabled = true;
    status.style.color = '#f9e2af';
    status.innerText = 'Нейросеть генерирует голос...';
    player.style.display = 'none';

    try {
      const response = await fetch('/tts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text, speaker: speaker })
      });

      if (!response.ok) throw new Error('Ошибка сервера');

      const blob = await response.blob();
      const audioUrl = URL.createObjectURL(blob);

      player.src = audioUrl;
      player.style.display = 'block';
      status.style.color = '#a6e3a1';
      status.innerText = 'Готово! Нажмите Play для прослушивания.';
      player.play();
    } catch (error) {
      status.style.color = '#f38ba8';
      status.innerText = 'Не удалось озвучить текст.';
      console.error(error);
    } finally {
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
